<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mvvmTitle mvvmDesc" style="">
  <title id="mvvmTitle" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">MVVM event and notification flow</title>
  <desc id="mvvmDesc" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Three layers (View, ViewModel, Model) with forward arrows on top for actions/events and backward arrows on the bottom for state and notifications. Six notification channels are listed under the Model-to-ViewModel arrow, split into push-based mechanisms and observation-based.</desc>

  <defs>
    <marker id="headFwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fafafa"/>
    </marker>
    <marker id="headBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/>
    </marker>
  </defs>

  

  <text x="500" y="30" text-anchor="middle" style="fill:rgb(250, 250, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:18px;font-weight:600;text-anchor:middle;dominant-baseline:auto">MVVM — event flow (→) and notification flow (←)</text>

  <!-- BOXES -->
  <rect x="80" y="200" width="220" height="110" rx="8" style="fill:none;stroke:rgb(161, 161, 170);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="190" y="240" text-anchor="middle" style="fill:rgb(250, 250, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:22px;font-weight:600;text-anchor:middle;dominant-baseline:auto">View</text>
  <text x="190" y="265" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">SwiftUI</text>
  <text x="190" y="283" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">@Environment / @Bindable</text>
  <text x="190" y="301" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">subscribes, no logic</text>

  <rect x="390" y="200" width="220" height="110" rx="8" style="fill:none;stroke:rgb(161, 161, 170);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="500" y="240" text-anchor="middle" style="fill:rgb(250, 250, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:22px;font-weight:600;text-anchor:middle;dominant-baseline:auto">ViewModel</text>
  <text x="500" y="265" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">@Observable (+ @MainActor)</text>
  <text x="500" y="283" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">UI state + transformations</text>
  <text x="500" y="301" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">no SwiftUI imports</text>

  <rect x="700" y="200" width="220" height="110" rx="8" style="fill:none;stroke:rgb(161, 161, 170);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="810" y="240" text-anchor="middle" style="fill:rgb(250, 250, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:22px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Model</text>
  <text x="810" y="265" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Sensors / Services / Domain</text>
  <text x="810" y="283" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">active (push) or passive (state)</text>
  <text x="810" y="301" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">no UI knowledge</text>

  <!-- FORWARD ARROWS (events) — View → VM → Model -->
  <text x="345" y="158" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">tap, toggle, gesture</text>
  <text x="345" y="176" text-anchor="middle" style="fill:rgb(250, 250, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:auto">user action / event</text>
  <line x1="300" y1="190" x2="390" y2="190" marker-end="url(#headFwd)" style="fill:none;stroke:rgb(250, 250, 250);color:rgb(255, 255, 255);stroke-width:1.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="655" y="158" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">startMonitoring(), login(), save()…</text>
  <text x="655" y="176" text-anchor="middle" style="fill:rgb(250, 250, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:auto">method call</text>
  <line x1="610" y1="190" x2="700" y2="190" marker-end="url(#headFwd)" style="fill:none;stroke:rgb(250, 250, 250);color:rgb(255, 255, 255);stroke-width:1.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- BACKWARD ARROWS (notifications) — Model → VM → View -->
  <line x1="390" y1="330" x2="300" y2="330" marker-end="url(#headBack)" style="fill:none;stroke:rgb(251, 146, 60);color:rgb(255, 255, 255);stroke-width:1.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="345" y="350" text-anchor="middle" style="fill:rgb(251, 146, 60);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:auto">state change (observed)</text>
  <text x="345" y="368" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">SwiftUI tracks @Observable mutations</text>
  <text x="345" y="384" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">via the Observation framework</text>

  <line x1="700" y1="330" x2="610" y2="330" marker-end="url(#headBack)" style="fill:none;stroke:rgb(251, 146, 60);color:rgb(255, 255, 255);stroke-width:1.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="655" y="350" text-anchor="middle" style="fill:rgb(251, 146, 60);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:auto">notification / state change</text>

  <!-- MECHANISMS LIST — split into two families -->
  <text x="655" y="372" text-anchor="middle" style="fill:rgb(251, 146, 60);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">over one of these channels:</text>

  <text x="655" y="390" text-anchor="middle" style="fill:rgb(251, 146, 60);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">— push (active source: timer, network, …) —</text>
  <text x="655" y="406" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">delegate / protocol callback</text>
  <text x="655" y="422" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">NotificationCenter</text>
  <text x="655" y="438" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Combine PassthroughSubject  (stateless)</text>
  <text x="655" y="454" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Combine CurrentValueSubject  (stateful)</text>
  <text x="655" y="470" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">AsyncStream  (Swift Concurrency)</text>

  <text x="655" y="490" text-anchor="middle" style="fill:rgb(251, 146, 60);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">— observation (passive Model: session, settings, …) —</text>
  <text x="655" y="506" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, SFMono-Regular, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">@Observable on Model  (mutation = signal)</text>

  <!-- FOOTER caption -->
  <text x="500" y="540" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">
    The two arrows form a cycle, not a one-way street — strict UDF requires a framework (TCA, MVI) that enforces it.
  </text>
  <text x="500" y="558" text-anchor="middle" style="fill:rgb(161, 161, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-sans-serif, system-ui, sans-serif;font-size:12px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">
    MVVM defines who knows whom; both the channel family and the specific channel are independent choices.
  </text>
</svg>